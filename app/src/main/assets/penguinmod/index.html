<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes">
  <meta name="google" value="notranslate">
  <meta name="description" content="PenguinMod is a TurboWarp mod that was made to add tons of cool stuff to allow for crazy projects."/>
  <title>PenguinMod - Editor</title>
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="assets/icons/penguinmod_logo.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #0b1017;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    #splash {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0b1017;
      color: #00c3ff;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    .tw-loaded #splash, #splash.hidden {
      display: none !important;
    }
    #splash-spinner {
      display: block;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 6px solid #00c3ff;
      border-color: #00c3ff transparent #00c3ff transparent;
      animation: splash-spinner 1.2s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes splash-spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .splash-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .splash-title span {
      color: #00c3ff;
    }
    .splash-subtitle {
      font-size: 13px;
      color: #8899a6;
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <noscript><h1>Activa JavaScript para usar PenguinMod</h1></noscript>
    <div id="splash-content" style="display: flex; flex-direction: column; align-items: center;">
      <div id="splash-spinner"></div>
      <div class="splash-title">Penguin<span>Mod</span> Editor</div>
      <div class="splash-subtitle">Cargando entorno de bloques...</div>
    </div>
  </div>

  <div id="app"></div>

  <!-- PenguinMod Official Core Bundles -->
  <script src="js/vendors~addon-settings~credits~editor~embed~fullscreen~player~playground.b2f76df5a88195d58a28.js"></script>
  <script src="js/vendors~editor~embed~fullscreen~player~playground.0e126822fbe7aa48f3cb.js"></script>
  <script src="js/addon-settings~addons~editor~fullscreen~player~playground.7b275ed99b336e624f05.js"></script>
  <script src="js/editor~embed~fullscreen~player~playground.28bacba0fa522911d6a8.js"></script>
  <script src="js/editor.48627746cf3fad1b4968.js"></script>

  <!-- Android Native Bridge Integration -->
  <script>
    (function() {
      // Hide splash if app rendered
      var appObserver = new MutationObserver(function(mutations, obs) {
        var appEl = document.getElementById('app');
        if (appEl && appEl.children.length > 0) {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(function() { splash.style.display = 'none'; }, 300);
          }
          obs.disconnect();
        }
      });
      var appEl = document.getElementById('app');
      if (appEl) {
        appObserver.observe(appEl, { childList: true, subtree: true });
      }

      // Intercept file downloads from PenguinMod (such as File -> Save to your computer / Guardar como)
      if (!window.showSaveFilePicker) {
        window.showSaveFilePicker = async function(options) {
          var suggestedName = (options && options.suggestedName) || 'Mi_Proyecto.pmp';
          return {
            name: suggestedName,
            createWritable: async function() {
              var chunks = [];
              return {
                write: async function(data) {
                  chunks.push(data);
                },
                close: async function() {
                  var blob = new Blob(chunks);
                  var reader = new FileReader();
                  reader.onload = function() {
                    if (window.AndroidPenguin && window.AndroidPenguin.onSaveAsTriggered) {
                      window.AndroidPenguin.onSaveAsTriggered(suggestedName, reader.result);
                    }
                  };
                  reader.readAsDataURL(blob);
                },
                abort: async function() {}
              };
            }
          };
        };
      }

      var originalAnchorClick = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function() {
        if (this.download && this.href) {
          var filename = this.download;
          var href = this.href;
          if (href.startsWith('blob:') || href.startsWith('data:')) {
            fetch(href).then(function(res) { return res.blob(); }).then(function(blob) {
              var reader = new FileReader();
              reader.onload = function() {
                var base64 = reader.result;
                if (window.AndroidPenguin && window.AndroidPenguin.onSaveAsTriggered) {
                  window.AndroidPenguin.onSaveAsTriggered(filename, base64);
                }
              };
              reader.readAsDataURL(blob);
            }).catch(function(err) {
              console.warn('[AndroidPenguin] Download intercept fallback', err);
              originalAnchorClick.apply(this, arguments);
            });
            return;
          }
        }
        return originalAnchorClick.apply(this, arguments);
      };

      function base64ToArrayBuffer(base64) {
        if (base64.indexOf(',') !== -1) {
          base64 = base64.split(',')[1];
        }
        var binary_string = window.atob(base64);
        var len = binary_string.length;
        var bytes = new Uint8Array(len);
        for (var i = 0; i < len; i++) {
          bytes[i] = binary_string.charCodeAt(i);
        }
        return bytes.buffer;
      }

      // Hook Scratch VM for native Android capabilities
      function initPenguinAndroidBridge() {
        if (window.vm) {
          console.log('[AndroidPenguin] Hooking Scratch VM...');
          window.penguinApp = {
            triggerSaveAs: function() {
              if (window.vm && window.vm.saveProjectSb3) {
                window.vm.saveProjectSb3().then(function(blob) {
                  var reader = new FileReader();
                  reader.onload = function() {
                    var base64 = reader.result;
                    var title = 'Proyecto_Penguin';
                    try {
                      if (window.vm.runtime && window.vm.runtime.projectName) {
                        title = window.vm.runtime.projectName;
                      }
                    } catch(e) {}
                    if (window.AndroidPenguin && window.AndroidPenguin.onSaveAsTriggered) {
                      window.AndroidPenguin.onSaveAsTriggered(title, base64);
                    }
                  };
                  reader.readAsDataURL(blob);
                }).catch(function(err) {
                  console.error('Error saving project:', err);
                });
              }
            },
            saveProject: function() {
              this.triggerSaveAs();
            },
            loadProjectFromData: function(dataOrBase64, title) {
              if (!window.vm) return;
              try {
                var buffer;
                if (typeof dataOrBase64 === 'string') {
                  if (dataOrBase64.startsWith('{') || dataOrBase64.startsWith('[')) {
                    buffer = dataOrBase64;
                  } else {
                    buffer = base64ToArrayBuffer(dataOrBase64);
                  }
                } else {
                  buffer = dataOrBase64;
                }
                window.vm.stop();
                window.vm.loadProject(buffer).then(function() {
                  if (title && window.vm.runtime) {
                    window.vm.runtime.projectName = title;
                  }
                  if (window.vm.renderer) {
                    window.vm.renderer.draw();
                  }
                  if (window.AndroidPenguin && window.AndroidPenguin.showToast) {
                    window.AndroidPenguin.showToast('✓ Proyecto "' + (title || 'cargado') + '" listo en el editor');
                  }
                }).catch(function(err) {
                  console.error('Error al cargar proyecto:', err);
                  if (window.AndroidPenguin && window.AndroidPenguin.showToast) {
                    window.AndroidPenguin.showToast('Error al cargar proyecto: ' + err.message);
                  }
                });
              } catch(e) {
                console.error('Exception loading project:', e);
              }
            },
            loadProjectFromJSON: function(data) {
              this.loadProjectFromData(data, 'Proyecto');
            },
            triggerGreenFlag: function() {
              if (window.vm && window.vm.greenFlag) {
                window.vm.greenFlag();
              }
            },
            triggerStopAll: function() {
              if (window.vm && window.vm.stopAll) {
                window.vm.stopAll();
              }
            }
          };
        } else {
          setTimeout(initPenguinAndroidBridge, 400);
        }
      }
      initPenguinAndroidBridge();
    })();
  </script>
</body>
</html>
