name: Build PenguinMod Android APK

on:
  push:
    branches: [ "main", "master", "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Download
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/*.apk output_apk/PenguinMod-Android.apk
          echo "APK successfully prepared: $(ls -lh output_apk/PenguinMod-Android.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenguinMod-Android-APK
          path: output_apk/PenguinMod-Android.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish to GitHub Releases (Direct Download)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "PenguinMod Android APK (Última versión)"
          body: "Descarga directa del APK de PenguinMod listo para instalar en tu teléfono o tablet Android."
          files: output_apk/PenguinMod-Android.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
